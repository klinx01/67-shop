<div class="homepage-wrapper">

  @if (authService.isLoggedIn()) {
    <header class="user-bar">
      <div class="logo">
        <span class="brand">67</span> shop
      </div>
      <div class="user-info">
        <span class="welcome-text">Welcome, <strong class="username">Guest User</strong>!</span>
        <button (click)="authService.logout()" class="btn-logout-small">
          Log Out
        </button>
      </div>
    </header>

    <main class="content-container">
      <app-product-list></app-product-list>
    </main>
  }

  @else {
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">67</div>
          <h2>Sign In to shop</h2>
        </div>

        <form class="auth-form" (submit)="$event.preventDefault()">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your login..." autocomplete="username" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password..." autocomplete="current-password" />
          </div>

          <button (click)="authService.login()" type="button" class="btn-login">
            Sign In
          </button>
        </form>
      </div>
    </div>
  }

</div>
